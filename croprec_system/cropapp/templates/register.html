<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register • Smart Crop Recommendation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href~="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../static/styles.css" />
    <script defer src="../static/script.js"></script>
  </head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <div class="logo">Smart Crop Recommendation</div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
        <nav class="nav-menu" id="navMenu">
          <a href="{% url 'home' %}#home" class="nav-link" id="homeNavLink">Home</a>
          <a href="{% url 'home' %}#features" class="nav-link">About</a>
          <a href="{% url 'predict' %}" class="nav-link" id="predictNavLink">Predict Crop</a>
          <a href="{% url 'result' %}" class="nav-link">Results</a>
          <a href="{% url 'login' %}" class="nav-link" id="loginNavLink">Login</a>
          <div class="nav-user hidden" id="navUser"><button class="avatar-btn" id="avatarBtn" aria-label="Account" aria-haspopup="true" aria-expanded="false"><span class="avatar-img"></span></button><div class="avatar-dropdown" id="avatarDropdown" role="menu"><button class="dropdown-item" id="logoutBtn">Logout</button></div></div>
        </nav>
      </div>
    </header>
    <main class="auth"><section class="auth-container"><article class="auth-card"><h1 class="auth-title">Create Account</h1><p class="auth-sub">Join Smart Crop Recommendation today.</p><form class="auth-form" method="POST" action="{% url 'register' %}" autocomplete="on">{% csrf_token %}<div class="form-row"><label for="fullName">Full Name</label><input id="fullName" name="fullName" type="text" class="input" placeholder="Enter your full name" required pattern="^[A-Za-z ]+$" title="Only alphabets and spaces are allowed" inputmode="text" /></div><div class="form-row"><label for="email">Email</label><input id="email" name="email" type="email" class="input" placeholder="you@example.com" required /></div><div class="form-row"><label for="mobile">Mobile Number</label><input id="mobile" name="mobile" type="tel" class="input" placeholder="Enter mobile number" required pattern="^[0-9]{10,15}$" title="Enter 10 digits" /></div><div class="form-row"><label for="regPassword">Password</label><input id="regPassword" name="password" type="password" class="input" placeholder="Create a password" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).+" title="Include uppercase, lowercase, number, and special character" /></div><div class="form-row"><label for="userTypeReg">Type</label><select id="userTypeReg" name="usertype" class="select" required><option value="" disabled selected>Select type</option><option value="Farmer">Farmer</option><option value="Researcher">Researcher</option></select></div><div class="form-row"><label for="gender">Gender</label><select id="gender" name="gender" class="select" required><option value="" disabled selected>Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><button type="submit" class="btn-primary full">Register</button></form><p class="auth-meta">Already have an account? <a href="{% url 'login' %}" class="link">Login</a></p></article></section></main>
  </body>
  </html>
