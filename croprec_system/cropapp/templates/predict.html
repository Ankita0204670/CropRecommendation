{% extends "base.html" %}
{% block title %}Predict Crop • Smart Crop Recommendation{% endblock %}
{% block content %}
<main class="auth">
  <section class="auth-container">
    <article class="auth-card">
      <h1 class="auth-title">Predict Crop</h1>
      <p class="auth-sub">Enter soil nutrients and conditions to get recommendations.</p>
      <form class="auth-form" method="POST" action="{% url 'predict' %}">
        {% csrf_token %}
        <div class="form-row">
          <label for="nitrogen">Nitrogen (N)</label>
          <input id="nitrogen" name="nitrogen" type="number" step="any" class="input" placeholder="e.g., 90" required />
        </div>
        <div class="form-row">
          <label for="phosphorus">Phosphorus (P)</label>
          <input id="phosphorus" name="phosphorus" type="number" step="any" class="input" placeholder="e.g., 45" required />
        </div>
        <div class="form-row">
          <label for="potassium">Potassium (K)</label>
          <input id="potassium" name="potassium" type="number" step="any" class="input" placeholder="e.g., 35" required />
        </div>
        <div class="form-row">
          <label for="temperature">Temperature (°C)</label>
          <input id="temperature" name="temperature" type="number" step="any" class="input" placeholder="e.g., 25" required />
        </div>
        <div class="form-row">
          <label for="humidity">Humidity (%)</label>
          <input id="humidity" name="humidity" type="number" step="any" class="input" placeholder="e.g., 70" required />
        </div>
        <div class="form-row">
          <label for="ph">pH</label>
          <input id="ph" name="ph" type="number" step="0.1" class="input" placeholder="e.g., 6.5" required />
        </div>
        <div class="form-row">
          <label for="rainfall">Rainfall (mm)</label>
          <input id="rainfall" name="rainfall" type="number" step="any" class="input" placeholder="e.g., 150" required />
        </div>
        <button type="submit" class="btn-primary full">Predict Crop</button>
      </form>
    </article>
  </section>
</main>
{% endblock %}
